name: spring-transaction-lab
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: local-lab-root
      MYSQL_DATABASE: txlab
      MYSQL_USER: txlab
      MYSQL_PASSWORD: txlab
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - txlab_data:/var/lib/mysql
volumes:
  txlab_data:
